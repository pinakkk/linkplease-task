# LinkPlease backend — Fly.io deployment.
#
# READ BEFORE EDITING: the submitted `working_url` must stay live for 7 days
# past the deadline. A sleeping machine scores zero. Do not "optimise" the
# machine settings below.

app = "linkplease-backend"
# Region note: bom (Mumbai) had no volume capacity for the Postgres cluster at
# provision time, so both the app and the DB live in sin (Singapore) — they must
# share a region for the .flycast internal network to be fast.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true

  # NON-NEGOTIABLE (BLUEPRINT §0, §8.1): the grader hits this URL for days
  # after we submit, and PseudoGram delivers webhooks to it. A stopped machine
  # is a zero, so we pay for one always-on machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The concurrency model is one process, one send worker, one reconciler.
  # Scaling to a second machine would double the send rate against a 10/60s
  # limit and race the dedup counters. Keep this app at exactly 1 machine.
  #
  # TRAP, observed on the first deploy: `fly deploy` creates a SECOND machine
  # "for high availability" whenever min_machines_running >= 1, and says so only
  # in passing. Two machines = two send workers = a breached rate limit.
  # After EVERY deploy run:
  #     fly machines list --app linkplease-backend
  # and destroy any extra. `fly scale count 1` also pins it.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
